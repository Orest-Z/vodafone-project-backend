spring.config.import=optional:file:.env[.properties]

# ── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── App ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}
app.game-hub.timezone=${APP_GAME_HUB_TIMEZONE}
app.frontend.base-url=${APP_FRONTEND_BASE_URL}

# ── PassKit ─────────────────────────────────────────────────────────────────
passkit.api.base-url=${PASSKIT_API_BASE_URL}
passkit.api.token=${PASSKIT_API_TOKEN}
passkit.program-id=${PASSKIT_PROGRAM_ID}
passkit.tier-id=${PASSKIT_TIER_ID}
passkit.pass-url-host=${PASSKIT_PASS_URL_HOST}

# ── Mail ─────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
